services:
  zipzup:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # ports:
    #   - "5000:5000"
    volumes:
      - ../app:/app
    depends_on:
      - redis
      - selenium
      - postgresql
      - mediaflow-proxy
    environment:
      POSTGRES_USER: zipzup
      POSTGRES_PASSWORD: zipzup
      POSTGRES_DB: zipzup
      POSTGRES_HOST: postgresql
      DEBUG: true
    entrypoint: ["sleep", "infinity"]

  redis:
    image: valkey/valkey:8.1.2-alpine3.22
  
  selenium:
    image: selenium/standalone-chromium

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zipzup
      POSTGRES_PASSWORD: zipzup
      POSTGRES_DB: zipzup

    volumes:
      - postgres_data:/var/lib/postgresql/data
  mediaflow-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediaflow-proxy:
    image: mhdzumair/mediaflow-proxy:latest
    # ports:
    #   - "8889:8888"
    environment:
#      - API_PASSWORD=your_password
      - REDIS_URL=redis://mediaflow-redis:6379
    depends_on:
      mediaflow-redis:
        condition: service_healthy

  caddy:
    image: caddy
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile
    user: 1000:1000
    ports:
      - 127.0.0.1:5000:5000
    
  


volumes:
  postgres_data: {}